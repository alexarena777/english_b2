<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#195c49" />
    <title>Offline · B2 Trainer</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f4ee; color: #17211d; }
      main { width: min(520px, calc(100% - 40px)); padding: 42px; border: 1px solid #d8ddd9; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px rgba(15, 50, 38, .12); text-align: center; }
      span { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: #dff1e8; color: #195c49; font-size: 26px; font-weight: 900; }
      h1 { margin: 20px 0 8px; font-family: Georgia, serif; font-size: 36px; }
      p { color: #66736d; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; padding: 12px 18px; border-radius: 12px; background: #195c49; color: #fff; text-decoration: none; font-weight: 750; }
      @media (prefers-color-scheme: dark) { body { background: #101713; color: #edf5f0; } main { background: #18231e; border-color: #34443c; } p { color: #aebbb4; } }
    </style>
  </head>
  <body>
    <main>
      <span>B2</span>
      <h1>Sei offline.</h1>
      <p>Le sezioni già aperte restano disponibili. Riprova quando la connessione torna attiva per sincronizzare i progressi.</p>
      <a href="/dashboard">Riprova</a>
    </main>
  </body>
</html>
